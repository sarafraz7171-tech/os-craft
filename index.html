
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OS CRAFT | وضعیت سرور</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Tahoma, Arial, sans-serif;
      background: #101116;
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .server-card {
      width: 100%;
      max-width: 460px;
      background: linear-gradient(145deg, #20212a, #15161d);
      border: 1px solid #343541;
      border-radius: 22px;
      padding: 28px;
      box-shadow: 0 20px 60px #0008;
    }

    .logo {
      color: #ff3939;
      font-size: 28px;
      font-weight: bold;
      letter-spacing: 2px;
      text-align: center;
    }

    .subtitle {
      color: #999;
      text-align: center;
      margin-top: 8px;
      font-size: 13px;
    }

    .status {
      margin: 28px 0;
      padding: 20px;
      border-radius: 15px;
      background: #292a34;
      text-align: center;
    }

    .status-dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #888;
      margin-left: 8px;
    }

    .status-text {
      font-size: 23px;
      font-weight: bold;
    }

    .online { color: #35df85; }
    .offline { color: #ff5050; }
    .checking { color: #ffc857; }

    .status.online-bg .status-dot { background: #35df85; }
    .status.offline-bg .status-dot { background: #ff5050; }
    .status.checking-bg .status-dot { background: #ffc857; }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .stat {
      background: #292a34;
      border-radius: 13px;
      padding: 18px 10px;
      text-align: center;
    }

    .stat-value {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .stat-label {
      color: #aaa;
      font-size: 12px;
    }

    .ip-box {
      margin-top: 18px;
      padding: 15px;
      background: #292a34;
      border-radius: 12px;
      text-align: center;
      direction: ltr;
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    button {
      width: 100%;
      margin-top: 20px;
      border: none;
      border-radius: 12px;
      padding: 16px;
      background: #e52e38;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: .2s;
    }

    button:hover {
      background: #ff414b;
      transform: translateY(-2px);
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
      transform: none;
    }

    .last-check {
      color: #888;
      text-align: center;
      font-size: 11px;
      margin-top: 17px;
    }

    .error {
      color: #ff8585;
      text-align: center;
      font-size: 12px;
      margin-top: 12px;
      line-height: 1.8;
    }
  </style>
</head>

<body>

  <main class="server-card">

    <div class="logo">OS CRAFT</div>
    <div class="subtitle">SMP + ROLE PLAY</div>

    <section class="status" id="statusBox">
      <span class="status-dot"></span>
      <span class="status-text" id="statusText">
        هنوز بررسی نشده
      </span>
    </section>

    <section class="stats">

      <div class="stat">
        <div class="stat-value" id="players">--</div>
        <div class="stat-label">بازیکنان آنلاین</div>
      </div>

      <div class="stat">
        <div class="stat-value" id="maxPlayers">--</div>
        <div class="stat-label">ظرفیت سرور</div>
      </div>

      <div class="stat" style="grid-column: 1 / -1">
        <div class="stat-value" id="version">--</div>
        <div class="stat-label">نسخه ماینکرفت</div>
      </div>

    </section>

    <div class="ip-box">
      sarafraz7171-srv-os_craft_asli.play.mihancraft.com:25566
    </div>

    <button id="checkButton" onclick="checkServer()">
      بررسی وضعیت سرور
    </button>

    <div class="error" id="error"></div>

    <div class="last-check" id="lastCheck">
      آخرین بررسی: هنوز انجام نشده
    </div>

  </main>

  <script>
    const HOST =
      "sarafraz7171-srv-os_craft_asli.play.mihancraft.com";

    const PORT = 25566;

    async function checkServer() {
      const button = document.getElementById("checkButton");
      const statusBox = document.getElementById("statusBox");
      const statusText = document.getElementById("statusText");
      const errorBox = document.getElementById("error");

      button.disabled = true;
      button.textContent = "در حال بررسی...";
      errorBox.textContent = "";

      statusText.textContent = "در حال بررسی";
      statusText.className = "status-text checking";
      statusBox.className = "status checking-bg";

      try {
        const url =
          `https://api.mcsrvstat.us/3/${HOST}:${PORT}?t=${Date.now()}`;

        const response = await fetch(url, {
          cache: "no-store"
        });

        if (!response.ok) {
          throw new Error("API_RESPONSE_ERROR");
        }

        const data = await response.json();

        if (data.online === true) {
          statusText.textContent = "سرور آنلاین است";
          statusText.className = "status-text online";
          statusBox.className = "status online-bg";

          document.getElementById("players").textContent =
            data.players?.online ?? 0;

          document.getElementById("maxPlayers").textContent =
            data.players?.max ?? "--";

          document.getElementById("version").textContent =
            data.version || "نامشخص";

        } else {
          statusText.textContent = "سرور آفلاین است";
          statusText.className = "status-text offline";
          statusBox.className = "status offline-bg";

          document.getElementById("players").textContent = "--";
          document.getElementById("maxPlayers").textContent = "--";
          document.getElementById("version").textContent = "--";
        }

        document.getElementById("lastCheck").textContent =
          "آخرین بررسی: " + new Date().toLocaleTimeString("fa-IR");

      } catch (error) {
        statusText.textContent = "بررسی ناموفق بود";
        statusText.className = "status-text offline";
        statusBox.className = "status offline-bg";

        document.getElementById("players").textContent = "--";
        document.getElementById("maxPlayers").textContent = "--";
        document.getElementById("version").textContent = "--";

        errorBox.textContent =
          "ارتباط با سرویس بررسی وضعیت برقرار نشد. دوباره تلاش کن.";

        document.getElementById("lastCheck").textContent =
          "آخرین تلاش: " + new Date().toLocaleTimeString("fa-IR");

      } finally {
        button.disabled = false;
        button.textContent = "بررسی دوباره وضعیت سرور";
      }
    }
  </script>

</body>
</html>
